<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Contatos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            /* Impede seleção de texto e scroll acidental */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; 
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: center;
        }

        .botao img {
            width: 178px; 
            cursor: pointer;
            transition: 0.2s;
            border: none;
            display: block;

            /* BLOQUEIO TOTAL DE MOVIMENTO */
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;

            /* IMPEDE MENU DE "SALVAR IMAGEM" NO CELULAR */
            -webkit-touch-callout: none; 
            pointer-events: auto; /* Garante que o clique ainda funcione */
        }

        .botao img:hover {
            transform: scale(1.03); 
        }

        a {
            text-decoration: none;
            outline: none;
            /* Impede que o link mostre aquela caixa cinza ao clicar no iOS */
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://t.me/HexaLab01" target="_blank" class="botao">
            <img src="btn-telegram.jpg" alt="Telegram">
        </a>

        <a href="https://signal.me/#eu/IrQCrpBLfqXPhRtbXQrn-xjZYVvfi5tmbplsGH1EIgbrhi_PGvlLvpMqOX_Me5UE" target="_blank" class="botao">
            <img src="btn-signal.jpg" alt="Signal">
        </a>
    </div>

    <script>
        // Bloqueio extra via JavaScript para garantir que o clique direito 
        // ou o arrastar não funcionem de jeito nenhum
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.querySelectorAll('img').forEach(img => {
            img.onmousedown = (e) => e.preventDefault();
        });
    </script>
</body>
</html>
