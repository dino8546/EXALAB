<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Contatos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
            /* Impede que o usuário selecione qualquer texto acidentalmente */
            user-select: none;
            -webkit-user-select: none;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Espaço reduzido entre os botões */
            text-align: center;
        }
        .botao img {
            width: 178px; 
            cursor: pointer;
            transition: 0.2s;
            border: none;
            display: block;

            /* --- NOVO: ISSO IMPEDE O BOTÃO DE MEXER/ARRASTAR --- */
            -webkit-user-drag: none; /* Para Chrome, Safari e Edge */
            user-drag: none;         /* Padrão futuro */
            /* -------------------------------------------------- */
        }
        .botao img:hover {
            /* Diminuí um pouco o efeito de aumento para ficar mais sutil */
            transform: scale(1.03); 
        }
        a {
            text-decoration: none;
            outline: none;
            /* Garante que o link em si não seja arrastável no Firefox */
            -moz-user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELEGRAM: HexaLab01 -->
        <a href="https://t.me/HexaLab01" target="_blank" class="botao">
            <img src="btn-telegram.jpg" alt="Telegram">
        </a>

        <!-- SIGNAL: HexaLab.01 -->
        <a href="https://signal.me/#eu/HexaLab.01" target="_blank" class="botao">
            <img src="btn-signal.jpg" alt="Signal">
        </a>
    </div>
</body>
</html>
