<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Contatos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Tentei deixar o caminho da imagem o mais simples possível */
            background: url('fundo.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
        }
        .botao img {
            width: 160px; 
            cursor: pointer;
            transition: 0.3s;
            border: none;
            display: block;
        }
        .botao img:hover {
            transform: scale(1.1);
        }
        /* Remove qualquer contorno azul que o navegador coloca em links com imagem */
        a {
            text-decoration: none;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELEGRAM: HexaLab01 -->
        <a href="https://t.me/HexaLab01" target="_blank" class="botao">
            <img src="btn-telegram.jpg" alt="Telegram">
        </a>

        <!-- SIGNAL: HexaLab.01 -->
        <!-- Nota: No Signal, o link de username usa o formato #eu/ -->
        <a href="https://signal.me/#eu/HexaLab.01" target="_blank" class="botao">
            <img src="btn-signal.jpg" alt="Signal">
        </a>
    </div>
</body>
</html>
